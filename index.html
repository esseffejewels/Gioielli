<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gioielli d'Eleganza</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo">LUXE GIOIELLI</div>
        <nav>
            <a href="#collezione">Collezione</a>
            <a href="#chi-siamo">Chi Siamo</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Luce ed Eleganza Artigianale</h1>
        <p>Scopri la nuova collezione di gioielli</p>
        <a href="#collezione" class="btn">Scopri la Collezione</a>
    </section>

    <section id="collezione" class="products-section">
        <h2>La Nostra Collezione</h2>
        <div class="product-grid">
            
            <!-- Prodotto 1 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=600&q=80" alt="Collana Oro">
                <h3>Collana "Luce Dorata"</h3>
                <p class="price">€ 89,00</p>
                <a href="https://wa.me/393331234567?text=Ciao!%20Vorrei%20ordinare%20la%20Collana%20Luce%20Dorata" target="_blank" class="buy-btn">Acquista su WhatsApp</a>
            </div>

            <!-- Prodotto 2 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=600&q=80" alt="Anello">
                <h3>Anello Smeraldo</h3>
                <p class="price">€ 149,00</p>
                <a href="https://wa.me/393331234567?text=Ciao!%20Vorrei%20ordinare%20l'Anello%20Smeraldo" target="_blank" class="buy-btn">Acquista su WhatsApp</a>
            </div>

        </div>
    </section>

    <footer>
        <p>&copy; 2026 Luxe Gioielli</p>
    </footer>

</body>
</html>
